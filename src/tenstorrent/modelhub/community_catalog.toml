# Community bundles `tt model list --community` shows: those that passed the
# QuietBox 2 validation sweep of 2026-09-25/26, or were validated separately.
#
# TEMPORARY: a hand-curated list while the verification process is built. Once
# it ships, the listing goes back to the Hub (bundles._listed_repos) and this
# file is deprecated.
#
# Bundles not listed here can still be served; `tt serve` warns that they are
# not in the catalog.
#
# `tags` use the Hub tag vocabulary `tt-model push` writes, so a row classifies
# the same way a Hub listing would. Include a board/mesh tag ("p150x4"):
# without one, listing fetches the bundle's manifest from the Hub.
#
#   [[bundle]]
#   repo = "namespace/name"
#   tags = ["tt-model-container", "vllm-plugin", "blackhole", "p150x4"]

